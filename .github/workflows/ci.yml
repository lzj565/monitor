name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - run: sh scripts/check-agent-unit.sh

      # Both installers run as root on the user's machine. Notes below warning
      # level are all SC2015 on `[ a ] && [ b ] || die`, which is meant to die
      # when either test fails.
      - run: shellcheck -S warning install.sh install-hub.sh scripts/*.sh

      # This commit's hub against the latest released agent: the field contract
      # between the two repositories, and what the public view withholds.
      - run: cargo build
      - run: |
          curl -fsSL -o agent https://github.com/monitor-probe/agent/releases/latest/download/monitor-agent-x86_64-unknown-linux-musl
          chmod +x agent
      - run: scripts/e2e.sh target/debug/monitor-hub ./agent

  sing-box:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SagerNet/sing-box
          ref: v1.14.1
          path: sing-box-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
          cache-dependency-path: sing-box-source/go.sum
      - run: sh scripts/build-sing-box.sh sing-box-source "${{ matrix.arch }}" "dist/monitor-sing-box-${{ matrix.arch }}"
      - if: matrix.arch == 'amd64'
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
      - if: matrix.arch == 'amd64'
        run: PATH="$RUNNER_TEMP/bin:$PATH" sh scripts/check-sing-box-api.sh dist/monitor-sing-box-amd64
