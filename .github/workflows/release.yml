name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7

      # A v* tag can be neither moved nor deleted, so one that disagrees with the
      # version the binary reports stops here, before anything is published.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $V"; exit 1; }

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run on the runner rather than left to build.rs,
      # because the cross container below does not necessarily carry curl; it
      # finds the theme already unpacked.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # The hub embeds the panel, so its dist/ must exist before cargo runs.
      - run: npm ci && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo install --locked cross
      - run: cross build --release --locked --target ${{ matrix.target }}

      - run: cp "target/${{ matrix.target }}/release/monitor-hub" "monitor-hub-${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-hub-${{ matrix.target }}

  build-sing-box:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned sing-box version
        run: |
          set -euo pipefail
          SING_BOX_VERSION=$(sed -n 's/^const SING_BOX_VERSION: &str = "\([0-9.]*\)";$/\1/p' src/main.rs)
          [ -n "$SING_BOX_VERSION" ] || { echo "::error::SING_BOX_VERSION is missing or invalid"; exit 1; }
          echo "SING_BOX_VERSION=$SING_BOX_VERSION" >> "$GITHUB_ENV"

      - name: Checkout official sing-box source tag
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git upstream
          test "$(git -C upstream describe --exact-match --tags)" = "v$SING_BOX_VERSION"
          echo "Building SagerNet/sing-box $(git -C upstream rev-parse HEAD) from v$SING_BOX_VERSION"

      - uses: actions/setup-go@v7
        with:
          go-version-file: upstream/go.mod

      - name: Build V2Ray API enabled binary and validate it
        run: |
          set -euo pipefail
          cd upstream
          DEFAULT_TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          TAGS=$DEFAULT_TAGS
          for required_tag in with_v2ray_api with_purego; do
            if ! printf '%s' ",$TAGS," | grep -Fq ",$required_tag,"; then
              TAGS="$TAGS,$required_tag"
            fi
          done
          LDFLAGS=$(cat release/LDFLAGS)
          echo "Official DEFAULT_BUILD_TAGS: $DEFAULT_TAGS"
          echo "Final build tags: $TAGS"
          echo "Official LDFLAGS: $LDFLAGS"
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$SING_BOX_VERSION' $LDFLAGS -s -w -buildid=" \
            -o "$RUNNER_TEMP/sing-box" ./cmd/sing-box

          "$RUNNER_TEMP/sing-box" version | tee "$RUNNER_TEMP/sing-box-version.txt"
          grep -Eq "^sing-box version $SING_BOX_VERSION([[:space:]]|$)" "$RUNNER_TEMP/sing-box-version.txt"
          grep -Eq '(^|[[:space:],])with_v2ray_api([[:space:],]|$)' "$RUNNER_TEMP/sing-box-version.txt"

          cat > "$RUNNER_TEMP/config.json" <<'CONFIG'
          {
            "log": {"level": "warn"},
            "inbounds": [],
            "outbounds": [{"type": "direct", "tag": "direct"}],
            "experimental": {
              "v2ray_api": {
                "listen": "127.0.0.1:10085",
                "stats": {"enabled": true, "users": []}
              }
            }
          }
          CONFIG
          "$RUNNER_TEMP/sing-box" check -c "$RUNNER_TEMP/config.json"

      - name: Package custom binary with official libcronet
        run: |
          set -euo pipefail
          ARCHIVE_DIR="sing-box-$SING_BOX_VERSION-linux-${{ matrix.arch }}"
          OFFICIAL_ARCHIVE="$RUNNER_TEMP/$ARCHIVE_DIR.tar.gz"
          PACKAGE_ROOT="$RUNNER_TEMP/package"
          curl --fail --location --retry 5 \
            "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/$ARCHIVE_DIR.tar.gz" \
            --output "$OFFICIAL_ARCHIVE"
          tar -tzf "$OFFICIAL_ARCHIVE" | grep -Fqx "$ARCHIVE_DIR/sing-box"
          tar -tzf "$OFFICIAL_ARCHIVE" | grep -Fqx "$ARCHIVE_DIR/libcronet.so"
          mkdir -p "$PACKAGE_ROOT"
          tar -xzf "$OFFICIAL_ARCHIVE" -C "$PACKAGE_ROOT"
          install -m 0755 "$RUNNER_TEMP/sing-box" "$PACKAGE_ROOT/$ARCHIVE_DIR/sing-box"
          tar -czf "$RUNNER_TEMP/monitor-sing-box-$SING_BOX_VERSION-linux-${{ matrix.arch }}.tar.gz" \
            -C "$PACKAGE_ROOT" "$ARCHIVE_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: monitor-sing-box-${{ matrix.arch }}
          path: ${{ runner.temp }}/monitor-sing-box-*.tar.gz

  release:
    needs: [build, build-sing-box]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # The Dockerfile lives in the repo; the binaries it copies do not.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      # A manual dispatch builds and collects the binaries; only a tag publishes,
      # so the path can be exercised without cutting a release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      #
      # sha256sums.txt is generated from inside bin/ so the names in it are bare
      # asset names, which is what install-hub.sh matches before installing the
      # binary into /opt/monitor.
      #
      # install-hub.sh is published with them and hashed alongside: the upgrade
      # path is a re-run of a copy saved on the machine, which may be several
      # releases old, and this entry is what lets that copy recognise itself as
      # such. It is published per release rather than read from main, so the
      # script a release was tested with is the one it is measured against.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp install-hub.sh bin/
          (cd bin && sha256sum monitor-hub-* monitor-sing-box-*.tar.gz install-hub.sh > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-hub-* bin/monitor-sing-box-*.tar.gz bin/install-hub.sh bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      # The image carries the binary this release already published, so the two
      # cannot disagree on what a given tag contains. docker and buildx ship on
      # the runner, for the same reason gh does above.
      #
      # Both registries receive the same manifest from one build: Docker Hub is
      # where `docker run monitor` looks first, ghcr is what the repository
      # publishes alongside its binaries. A fork without the Docker Hub secrets
      # still gets its ghcr image rather than a failed release.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp bin/monitor-hub-x86_64-unknown-linux-musl monitor-hub-amd64
          cp bin/monitor-hub-aarch64-unknown-linux-musl monitor-hub-arm64
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="-t $IMAGE:$VERSION -t $IMAGE:latest"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Same repository name as on GitHub, under the account the token belongs to.
            HUB="docker.io/$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY##*/}"
            TAGS="$TAGS -t $HUB:$VERSION -t $HUB:latest"
          else
            echo "no Docker Hub credentials configured; publishing to ghcr only"
          fi
          # The default builder cannot produce two platforms in one manifest.
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push $TAGS .
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
